[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secondlook"
version = "0.1.0"
description = "Safely disarmed local physical AI inspection runtime"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["secondlook*"]

[tool.setuptools.package-data]
secondlook = ["static/*"]

[dependency-groups]
cv = [
    "anomalib>=2.6.2",
    "av>=18.1.0",
    "opencv-python-headless>=5.0.0.93",
    "openvino>=2026.3.1",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "timm>=1.0.29",
    "torch>=2.14.0",
]
dev = [
    "numpy>=2.4.6",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
