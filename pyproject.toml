[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secondlook"
version = "0.1.0"
description = "Safely disarmed local physical AI inspection runtime"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["secondlook*"]

[tool.setuptools.package-data]
secondlook = ["static/*"]
